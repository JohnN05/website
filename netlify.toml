[build]
  command = "npm run build"
  publish = "dist"

# Astro emits content-hashed assets under /_astro/ (the filename changes when
# the content does), so they can be cached effectively forever. Netlify's
# default (max-age=0, must-revalidate) would revalidate every CSS/JS file on
# every repeat visit.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
